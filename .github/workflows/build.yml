name: Build APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (örn 1.2)"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: unzip -o TvLauncher.zip
      - run: gradle assembleDebug --no-daemon
        working-directory: TvLauncher
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: TvLauncher/app/build/outputs/apk/debug/app-debug.apk
