name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: unzip -o TvLauncher.zip
      - run: gradle assembleDebug --no-daemon
        working-directory: TvLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: TvLauncher/app/build/outputs/apk/debug/app-debug.apk
      # Sabit indirme linki: her derlemede "apk" sürümündeki dosya en yenisiyle değiştirilir
      # https://github.com/arslanburak/tvlauncher/releases/download/apk/app-debug.apk
      - name: Sabit linke yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "PiLauncher (son sürüm)" --notes "Her derlemede en yeni APK ile güncellenir."
          gh release upload apk TvLauncher/app/build/outputs/apk/debug/app-debug.apk --clobber
